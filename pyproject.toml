[project]
name = "mcp-auditor"
version = "0.1.0"
description = "Static security auditor for MCP servers: detects tool poisoning and over-privileged tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Roza" }]
keywords = ["mcp", "security", "audit", "tool-poisoning", "llm"]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.scripts]
mcp-audit = "mcp_auditor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_auditor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

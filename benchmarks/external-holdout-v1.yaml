    capability_defaults:
      filesystem.read: false
      filesystem.write: false
      filesystem.delete: false
      database.read: false
      database.write: false
      database.raw-query: false
      database.destructive: false
      network.outbound: true
      process.execute: false
      environment.read: false
      secrets.read: false
    capabilities:
      - {tool: jira_download_attachments, capability: filesystem.write, expected: true}
      - {tool: confluence_upload_attachment, capability: filesystem.read, expected: true}
      - {tool: confluence_upload_attachments, capability: filesystem.read, expected: true}

  - id: tavily-mcp
    target: tavily-mcp
    shape: ts-sdk-server-tool-array
    source_role: production
    has_auth_signal: true
    rationale: >-
      Each handler sends a request through the Tavily axios client. The crawl,
      map, and extract surfaces accept caller-controlled destination URLs; the
      extract surface carries them as an array. No handler accesses local files,
      processes, databases, environment variables, or secrets at call time.
    expected_tools:
      - tavily_search
      - tavily_extract
      - tavily_crawl
      - tavily_map
      - tavily_research
    capability_defaults:
      filesystem.read: false
      filesystem.write: false
      filesystem.delete: false
      database.read: false
      database.write: false
      database.raw-query: false
      database.destructive: false
      network.outbound: true
      process.execute: false
      environment.read: false
      secrets.read: false
    labels:
      - {rule: OP-002, tool: tavily_extract, expected: true}
      - {rule: OP-002, tool: tavily_crawl, expected: true}
      - {rule: OP-002, tool: tavily_map, expected: true}
      - {rule: ME-001, tool: null, expected: false}
      - {rule: CR-001, tool: null, expected: false}
      - {rule: RP-001, tool: null, expected: false}

  - id: fetch-mcp
    target: fetch-mcp
    shape: ts-lowlevel-list-tools-dispatch
    source_role: production
    has_auth_signal: false
    rationale: >-
      All six tools fetch remote content. validateUrl rejects non-HTTP(S),
      private/reserved destinations, and DNS rebinding before use. The YouTube
      fallback can run yt-dlp, creates a temporary output directory, reads the
      generated subtitle, and removes the directory. pnpm-lock.yaml freezes the
      dependency graph even though RP-001's current lockfile list may miss it.
    expected_tools:
      - fetch_html
      - fetch_markdown
      - fetch_txt
      - fetch_json
      - fetch_readable
      - fetch_youtube_transcript
    capability_defaults:
      filesystem.read: false
      filesystem.write: false
      filesystem.delete: false
      database.read: false
      database.write: false
      database.raw-query: false
      database.destructive: false
      network.outbound: true
      process.execute: false
      environment.read: false
      secrets.read: false
    capabilities:
      - {tool: fetch_youtube_transcript, capability: filesystem.read, expected: true}
      - {tool: fetch_youtube_transcript, capability: filesystem.write, expected: true}
      - {tool: fetch_youtube_transcript, capability: filesystem.delete, expected: true}
      - {tool: fetch_youtube_transcript, capability: process.execute, expected: true}
    labels:
      - {rule: OP-002, tool: fetch_html, expected: false}
      - {rule: OP-002, tool: fetch_markdown, expected: false}
      - {rule: OP-002, tool: fetch_txt, expected: false}
      - {rule: OP-002, tool: fetch_json, expected: false}
      - {rule: OP-002, tool: fetch_readable, expected: false}
      - {rule: OP-002, tool: fetch_youtube_transcript, expected: false}
      - {rule: CI-001, tool: fetch_youtube_transcript, expected: true}
      - {rule: ME-001, tool: null, expected: true}
      - {rule: RP-001, tool: null, expected: false}

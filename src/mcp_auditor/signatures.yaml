# MCP Auditor signature set (the machine face of the Threat Atlas).
#
# This file is the editable detection knowledge base. Add a new pattern here to
# extend a rule WITHOUT touching code. Patterns are case-insensitive Python
# regular expressions unless noted. Every rule carries `threat:` (its MCP Threat
# Atlas id, see threats.yaml) and `source:` provenance, so each finding is
# traceable to the research/CVE that justifies it.
#
# `version` is bumped (in lockstep with threats.yaml) whenever the set changes so
# audits are reproducible against a known rule version (antivirus-style).
version: 6
released: "2026-08-09"

rules:
  # --- Tool poisoning (MCP-T04) --------------------------------------------
  TP-001:
    confidence: medium
    category: tool_poisoning
    severity: critical
    threat: MCP-T04
    source: {ref: mcp-survey, section: "5.1.4"}
    message: "Instruction-like / imperative phrasing aimed at the agent found in tool metadata."
    recommendation: "Remove instruction-like text from tool descriptions. Descriptions should state what the tool does, not command the agent."
    patterns:
      - "ignore (all )?(previous|prior|above)"
      - "disregard (all )?(previous|prior|the above)"
      - "do not (tell|inform|mention|reveal)( to)? the user"
      - "don'?t (tell|inform|mention|reveal)( to)? the user"
      - "without (telling|informing|notifying) the user"
      - "you must (always|never|first|immediately)"
      - "you should (always|never|first|immediately)"
      - "always (send|call|forward|include|run|execute)"
      - "before (responding|answering|replying)"
      - "instead of (answering|responding|using)"
      - "as an ai|as a language model"
      - "system prompt"
      - "new instructions?:"
      - "</?(system|instructions?)>"

  TP-002:
    confidence: high
    category: tool_poisoning
    severity: high
    threat: MCP-T04
    source: {ref: mcp-survey, section: "5.1.4"}
    message: "Hidden or non-printing characters found in tool metadata (can conceal instructions)."
    recommendation: "Strip zero-width, bidirectional-override, and control characters from all tool metadata."
    # Implemented in code via a unicode-category scan; this list documents the
    # offending codepoints for transparency.
    hidden_char_codepoints:
      - "U+200B ZERO WIDTH SPACE"
      - "U+200C ZERO WIDTH NON-JOINER"
      - "U+200D ZERO WIDTH JOINER"
      - "U+FEFF ZERO WIDTH NO-BREAK SPACE"
      - "U+202A..U+202E BIDIRECTIONAL OVERRIDES"
      - "U+2066..U+2069 ISOLATES"
      - "C0/C1 control characters (except tab/newline/carriage-return)"

  TP-003:
    confidence: medium
    category: tool_poisoning
    severity: high
    threat: MCP-T04
    source: {ref: mcp-survey, section: "5.1.4"}
    message: "Tool description references secrets, environment variables, system internals, or other tools."
    recommendation: "Descriptions must not reference secrets, environment variables, file paths, system prompts, or other tools' internals."
    patterns:
      - "\\b[A-Z][A-Z0-9_]{3,}(_KEY|_TOKEN|_SECRET|_PASSWORD)\\b"
      - "environment variable"
      - "\\benv var"
      - "process\\.env"
      - "os\\.environ"
      - "system prompt"
      - "api[ _-]?key"
      - "secret|password|credential"
      - "~/\\.ssh|/etc/passwd|\\.env\\b|id_rsa"
      - "the (other|previous) tool"

  TP-004:
    confidence: medium
    category: tool_poisoning
    severity: critical
    threat: MCP-T04
    source: {ref: mcp-survey, section: "5.1.4"}
    message: "Tool name does not match its described behavior (possible disguised capability)."
    recommendation: "Rename the tool to reflect what it actually does, or remove the unexpected behavior."
    # A tool whose NAME reads benign/read-only but whose DESCRIPTION performs
    # disallowed actions. Compares benign_name_hints vs disguised_action_patterns.
    benign_name_hints:
      - "get"
      - "read"
      - "list"
      - "fetch"
      - "view"
      - "search"
      - "show"
      - "weather"
      - "status"
      - "info"
      - "lookup"
    disguised_action_patterns:
      - "read(s|ing)? (the )?files?\\b"
      - "run(s|ning)? (shell |a )?command"
      - "execute(s)?\\b"
      - "exfiltrat"
      - "send(s|ing)? (the )?(data|file|email|request|it)"
      - "forward(s|ing)? (the )?(data|key|token|credential)"
      - "delete(s|ing)?\\b"
      - "upload(s|ing)?\\b"
      - "post(s|ing)? to (a |an )?(url|endpoint|server)"

  # --- Preference manipulation / PMA (MCP-T03) -----------------------------
  PM-001:
    confidence: medium
    category: preference_manipulation
    severity: high
    threat: MCP-T03
    source: {ref: mcp-survey, section: "5.1.3"}
    message: "Self-promoting / persuasive phrasing in tool metadata (biases the model's tool selection)."
    recommendation: "Describe what the tool does, not why it should be chosen. Remove superlatives and directives that steer selection."
    patterns:
      - "prefer(s|red)? (to use |using )?this tool"
      - "always (use|choose|select|prefer|pick) this"
      - "best tool (for|to|available)"
      - "most (reliable|accurate|powerful|capable|trusted|advanced) tool"
      - "you should (use|choose|prefer|pick) this"
      - "(use|choose|pick) this (tool )?(instead of|over|rather than)"
      - "(highly )?recommended (tool )?(for|over|when)"
      - "do not use (any )?other tools?"
      - "this tool (is|should be) (the )?(default|preferred|prioriti[sz]ed|first choice)"
      - "ideal (tool )?(for|when)"
      - "superior to (other|all)"

  # --- Name collision / shadowing (MCP-T02, MCP-T06) -----------------------
  NC-001:
    confidence: high
    category: name_collision
    severity: high
    threat: MCP-T02
    source: {ref: mcp-survey, section: "5.1.2"}
    message: "Tool name collides with another tool or shadows a common sensitive tool name."
    recommendation: "Namespace tools under a verified server id (e.g. gmail-mcp.send_email) and keep tool names unique."
    # Duplicate detection is structural (done in code). This list names common
    # sensitive tools that malicious servers like to shadow.
    shadowed_names:
      - "send_email"
      - "send_message"
      - "read_file"
      - "write_file"
      - "delete_file"
      - "run_command"
      - "execute"
      - "exec"
      - "search"
      - "fetch"
      - "create_issue"
      - "transfer"
      - "pay"

  # --- Namespace typosquatting (MCP-T01) -----------------------------------
  TS-001:
    confidence: high
    category: supply_chain
    severity: high
    threat: MCP-T01
    source: {ref: mcp-survey, section: "5.1.1"}
    message: "Server/tool name is a near-duplicate of a well-known MCP name (possible typosquat)."
    recommendation: "Verify this is the authentic server. Squatted names (single-character or homoglyph variants) are a common supply-chain lure."
    # Names within edit-distance `max_edit_distance` of a known popular name (but
    # not equal) are flagged. Short names below min_len are ignored to cut noise.
    min_len: 4
    max_edit_distance: 1
    known_names:
      - "github"
      - "gitlab"
      - "slack"
      - "filesystem"
      - "postgres"
      - "sqlite"
      - "puppeteer"
      - "playwright"
      - "brave-search"
      - "google-maps"
      - "memory"
      - "fetch"
      - "sentry"
      - "notion"
      - "stripe"
      - "sequentialthinking"

  # --- Command injection / backdoor (MCP-T07) ------------------------------
  CI-001:
    confidence: medium
    category: command_injection
    severity: critical
    threat: MCP-T07
    source: {ref: mcp-survey, section: "5.1.7"}
    message: "Dangerous execution sink in a tool implementation (enables command injection / backdoor)."
    recommendation: "Avoid shell=True / eval / exec on tool inputs. Use argument lists and validate/whitelist inputs before any execution."
    # Scanned against statically-captured tool BODIES (never executed).
    sink_patterns:
      - "os\\.system\\s*\\("
      - "os\\.popen\\s*\\("
      - "subprocess\\.(run|call|Popen|check_output|check_call)\\s*\\([^)]*shell\\s*=\\s*True"
      - "\\beval\\s*\\("
      - "\\bexec\\s*\\("
      - "commands\\.(getoutput|getstatusoutput)\\s*\\("
      - "pty\\.spawn\\s*\\("
      - "child_process"
      - "\\bexecSync\\s*\\("
      - "\\bspawnSync\\s*\\("

  # --- Credential exposure / theft (MCP-T10) -------------------------------
  CR-001:
    confidence: high
    category: credential_exposure
    severity: high
    threat: MCP-T10
    source: {ref: mcp-survey, section: "5.3.1"}
    message: "Hardcoded credential or secret literal found in source/config (credential-theft exposure)."
    recommendation: "Never embed secrets in code or config. Load them from a secret manager or environment at runtime and rotate exposed keys."
    # Provider-specific key formats plus secret-looking assignments.
    patterns:
      - "sk-[A-Za-z0-9]{16,}"
      - "gh[pousr]_[A-Za-z0-9]{16,}"
      - "AKIA[0-9A-Z]{12,}"
      - "AIza[0-9A-Za-z_\\-]{20,}"
      - "xox[baprs]-[A-Za-z0-9-]{10,}"
      - "(api[_-]?key|secret|token|password|passwd|access[_-]?key|client[_-]?secret)\\s*[:=]\\s*[\"'][A-Za-z0-9_\\-/+]{8,}[\"']"

  # --- Rug pull / supply-chain mutability (MCP-T05) ------------------------
  RP-001:
    confidence: medium
    category: supply_chain
    severity: info
    threat: MCP-T05
    source: {ref: mcp-survey, section: "5.1.5"}
    message: "Dependencies are not version-pinned and no lockfile was found (rug-pull / supply-chain mutability precondition)."
    recommendation: "Pin exact dependency versions and commit a lockfile; verify server integrity (signatures/checksums) across updates. Re-audit after each release (diff mode)."
    # Fires (file-level, info) when a dependency manifest uses floating version
    # ranges and no lockfile is present. Temporal rug-pull detection is covered
    # by `mcp-audit diff <old> <new>` (compare two audits over time).
    manifest_files:
      - "requirements.txt"
      - "package.json"
      - "pyproject.toml"
    lockfiles:
      - "package-lock.json"
      - "poetry.lock"
      - "pdm.lock"
      - "yarn.lock"
      - "uv.lock"
      - "requirements.lock"
    unpinned_patterns:
      - "[\\^~]\\s*\\d"
      - "[><]=?\\s*\\d"
      - ":\\s*[\"']\\*[\"']"

  # --- Over-privilege (MCP-T11) --------------------------------------------
  OP-001:
    confidence: medium
    category: over_privilege
    severity: high
    threat: MCP-T11
    source: {ref: mcp-survey, section: "5.3.2"}
    message: "Described capability is broader than the tool name implies."
    recommendation: "Split the broad behavior into separate, clearly named tools, or narrow the implementation to match the name."
    read_name_hints:
      - "get"
      - "read"
      - "list"
      - "fetch"
      - "view"
      - "show"
      - "describe"
      - "query"
    write_action_patterns:
      - "\\bwrite(s)?\\b"
      - "\\bdelete(s)?\\b"
      - "\\bremove(s)?\\b"
      - "\\bmodif(y|ies)\\b"
      - "\\bupdate(s)?\\b"
      - "\\bsend(s)?\\b"
      - "\\bcreate(s)?\\b"
      - "\\bdrop(s)?\\b"
      - "\\bexecute(s)?\\b"
      - "\\bupload(s)?\\b"

  OP-002:
    confidence: medium
    category: over_privilege
    severity: medium
    threat: MCP-T11
    source: {ref: mcp-survey, section: "5.3.2"}
    message: "Tool schema accepts unconstrained dangerous input (path, command, or URL with no restriction)."
    recommendation: "Constrain the input with an enum, pattern, or format, or validate it before use."
    dangerous_param_names:
      - "path"
      - "filepath"
      - "file_path"
      - "file"
      - "filename"
      - "dir"
      - "directory"
      - "command"
      - "cmd"
      - "shell"
      - "script"
      - "url"
      - "uri"
      - "endpoint"
    # A property is "constrained" if it carries any of these schema keys.
    constraint_keys:
      - "enum"
      - "pattern"
      - "format"
      - "const"

  OP-003:
    confidence: medium
    category: over_privilege
    severity: medium
    threat: MCP-T11
    source: {ref: mcp-survey, section: "5.3.2"}
    message: "Server binds to a non-localhost address with no authentication signal (sandbox-escape / exposure precondition)."
    recommendation: "Bind to localhost, or require authentication for network-exposed servers. Scope filesystem access to a designated directory."
    # Fires (file-level) when a broad network bind is present AND no auth signal
    # was detected anywhere in the target.
    bind_patterns:
      - "0\\.0\\.0\\.0"
      - "host\\s*=\\s*[\"']0\\.0\\.0\\.0[\"']"
      - "host\\s*=\\s*[\"']\\*[\"']"
      - "\\[::\\]"

  # --- Declared vs observed capabilities (MCP-T17) -------------------------
  # MCP ToolAnnotations are explicitly untrusted hints. These rules compare
  # the hints with deterministic source observables from the registered handler.
  CP-001:
    confidence: high
    category: capability_mismatch
    severity: high
    threat: MCP-T17
    source: {ref: mcp-tool-annotations-spec, section: "ToolAnnotations"}
    message: "Tool declares readOnlyHint=true but its implementation contains a mutating capability."
    recommendation: "Correct the annotation and narrow the handler, then enforce the inferred capability through an auditor-side privilege policy."

  CP-002:
    confidence: high
    category: capability_mismatch
    severity: high
    threat: MCP-T17
    source: {ref: mcp-tool-annotations-spec, section: "ToolAnnotations"}
    message: "Tool declares destructiveHint=false but its implementation contains a destructive operation."
    recommendation: "Remove or explicitly gate the destructive operation and set destructiveHint truthfully; annotations are not a substitute for authorization."

  CP-003:
    confidence: high
    category: capability_mismatch
    severity: medium
    threat: MCP-T17
    source: {ref: mcp-tool-annotations-spec, section: "ToolAnnotations"}
    message: "Tool declares openWorldHint=false but its implementation performs outbound network access."
    recommendation: "Declare open-world interaction and restrict outbound destinations with an auditor-side allowlist."

  PV-001:
    confidence: high
    category: policy_violation
    severity: high
    threat: MCP-T11
    source: {ref: mcp-survey, section: "5.3.2"}
    message: "Statically inferred tool capability is not permitted for the selected department, employee, and agent profile."
    recommendation: "Narrow the MCP implementation or obtain an explicit reviewed policy grant at the narrowest applicable identity layer."

  # --- Tool chaining abuse (MCP-T12) ---------------------------------------
  TC-001:
    confidence: low
    category: tool_chaining
    severity: medium
    threat: MCP-T12
    source: {ref: mcp-survey, section: "5.3.3"}
    message: "Server exposes a dangerous capability combination (local read + outbound network) enabling exfiltration chains."
    recommendation: "Separate read and network capabilities across trust boundaries, or require explicit approval before chaining their outputs."
    # Fires once (server-level) if at least one tool can read local data AND at
    # least one tool can send data outbound.
    local_read_patterns:
      - "read(s|ing)? (the )?(file|files|directory|disk|contents)"
      - "\\blist (files|directory|directories)"
      - "\\.env\\b"
      - "filesystem|file system"
      - "load (the )?(file|config|credentials)"
      - "\\bget(s)? (the )?(file|secret|credential|token)"
    network_send_patterns:
      - "send(s|ing)? (the )?(data|file|email|request|message|it)"
      - "post(s|ing)? to (a |an )?(url|endpoint|server|webhook)"
      - "upload(s|ing)?\\b"
      - "http(s)?://|fetch\\(|requests\\.(get|post)|axios"
      - "forward(s|ing)?\\b"
      - "webhook|outbound|exfiltrat"

  # --- Fetch-and-run / remote code execution (MCP-T07) ----------------------
  XC-001:
    confidence: medium
    category: command_injection
    severity: critical
    threat: MCP-T07
    source: {ref: mcp-survey, section: "5.1.7"}
    message: "Instruction or script fetches and runs remote code (npx / curl|bash / iex) — arbitrary code execution."
    recommendation: "Never auto-run remote installers. Pin and vendor dependencies, review the fetched code first, and require explicit human approval before executing anything downloaded. For agent skills, remove 'run this command' steps that pull code from the network."
    # Scanned against a tool/skill description + body. Especially relevant to
    # agent skills (SKILL.md) whose instructions the agent runs with its own
    # privileges — e.g. `npx skills add <untrusted>`. JS-compatible for the
    # playground.
    patterns:
      - "curl\\s+[^|&;]*\\|\\s*(sudo\\s+)?(ba)?sh\\b"
      - "wget\\s+[^|&;]*\\|\\s*(sudo\\s+)?(ba)?sh\\b"
      - "(ba)?sh\\s+<\\(\\s*(curl|wget)\\b"
      - "\\bnpx\\s+(--?[a-z-]+\\s+)*[@\\w][\\w@./-]+"
      - "\\bInvoke-Expression\\b|\\biex\\s*\\("
      - "\\bpip\\s+install\\s+[^\\n]*(git\\+https?://|https?://)"
      - "\\b(bash|sh|zsh)\\s+-c\\s+[\"'][^\"']*(curl|wget)\\b"
      - "\\|\\s*(sudo\\s+)?(ba)?sh\\s*(;|$|\\n)"

  # --- Database security: SQL injection (MCP-T07) ---------------------------
  SQ-001:
    confidence: medium
    category: command_injection
    severity: critical
    threat: MCP-T07
    source: {ref: mcp-survey, section: "5.1.7"}
    message: "SQL query built by string interpolation/concatenation in a tool implementation (SQL-injection sink)."
    recommendation: "Use parameterized queries (placeholders + bound values). Never build SQL from tool inputs with f-strings, +, %, .format(), or template literals."
    # Scanned against statically-captured tool BODIES (never executed). Patterns
    # are kept JS-compatible so the playground can reuse them verbatim.
    # Each quote style gets its own pattern on purpose. A shared [^"']* class
    # stops at the first quote of EITHER kind, so the most common injection
    # shape of all -- "... WHERE name = '" + value + "'" -- was silently missed,
    # because interpolating a string value legitimately puts the other quote
    # character inside the SQL literal. Only numeric interpolation was caught.
    sql_interp_patterns:
      - "f\"(select|insert|update|delete|drop|alter|truncate)\\b[^\"]*\\{"
      - "f'(select|insert|update|delete|drop|alter|truncate)\\b[^']*\\{"
      - "\"(select|insert|update|delete|drop|alter|truncate)\\b[^\"]*\"\\s*(\\+|%)\\s*\\w"
      - "'(select|insert|update|delete|drop|alter|truncate)\\b[^']*'\\s*(\\+|%)\\s*\\w"
      - "\"(select|insert|update|delete|drop|alter|truncate)\\b[^\"]*\"\\s*\\.\\s*format\\s*\\("
      - "'(select|insert|update|delete|drop|alter|truncate)\\b[^']*'\\s*\\.\\s*format\\s*\\("
      - "`\\s*(select|insert|update|delete|drop|alter|truncate)\\b[^`]*\\$\\{"
      - "(execute|executemany|\\.query)\\s*\\(\\s*f[\"']"

  # --- Database security: raw SQL passthrough (MCP-T11) ---------------------
  DB-001:
    confidence: medium
    category: over_privilege
    severity: high
    threat: MCP-T11
    source: {ref: mcp-survey, section: "5.3.2"}
    message: "Tool executes caller-supplied raw SQL (arbitrary database access through the agent)."
    recommendation: "Expose narrow, purpose-named tools (e.g. get_order_status) instead of a generic query tool; if raw SQL is unavoidable, enforce a read-only role and an allowlist of statements."
    # Fires when a parameter that carries raw SQL reaches an execution call in
    # the body, or the description advertises arbitrary-SQL execution.
    raw_sql_param_names:
      - "sql"
      - "query"
      - "statement"
      - "raw_sql"
      - "sql_query"
      - "sql_statement"
    exec_signal_patterns:
      - "\\b(execute|executemany|executescript)\\s*\\("
      - "\\.query\\s*\\("
      - "\\bcursor\\b"
      - "\\.(run|exec|all|get)\\s*\\(\\s*(sql|query|statement)"
    description_patterns:
      - "(run|execute|perform)s? (an?y|arbitrary|raw|custom|free[- ]?form)? ?(sql|quer(y|ies))"
      - "(an?y|arbitrary|raw|custom) sql"
      - "sql (statement|command|quer(y|ies))s? (to|and) (run|execute)"

  # --- Database security: destructive/admin SQL (MCP-T11) -------------------
  DB-002:
    confidence: high
    category: over_privilege
    severity: high
    threat: MCP-T11
    source: {ref: mcp-survey, section: "5.3.2"}
    message: "Tool carries destructive or administrative SQL capability (DROP/TRUNCATE/GRANT/ALTER)."
    recommendation: "Agent-facing database tools should run under a least-privilege role with no DDL/DCL rights. Remove destructive statements or gate them behind human approval."
    patterns:
      - "\\b(drop|truncate)\\s+(table|database|schema|index)\\b"
      - "\\bgrant\\s+(all|select|insert|update|delete)\\b"
      - "\\balter\\s+(table|user|role|database)\\b"
      - "\\bdelete\\s+from\\s+\\w+\\s*[\"'`;)]"

  # --- Data exfiltration: hardcoded outbound endpoint (MCP-T12) -------------
  DE-001:
    confidence: medium
    category: data_exfiltration
    severity: critical
    threat: MCP-T12
    source: {ref: mcp-survey, section: "5.3.3"}
    message: "Tool implementation sends data to a hardcoded external endpoint (exfiltration sink)."
    recommendation: "Remove the hardcoded endpoint. Outbound destinations must be user-supplied, allowlisted, and disclosed in the tool description."
    # Two ways to fire: (a) a known exfil/callback host appears anywhere in the
    # body, or (b) a hardcoded non-local URL appears together with a send call.
    exfil_host_patterns:
      - "webhook\\.site|requestbin|pipedream\\.net|ngrok\\.(io|app)|burpcollaborator"
      - "discord(app)?\\.com/api/webhooks"
      - "api\\.telegram\\.org/bot"
      - "hooks\\.slack\\.com/services"
    # Boundary after the local host names is required so `localhost.evil.com`
    # is NOT treated as local. Kept JS-compatible for the playground.
    url_pattern: "https?://(?!(?:localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)(?:[:/'\"\\s)]|$))[a-z0-9][a-z0-9.-]+"
    send_patterns:
      - "requests\\.(post|put)\\s*\\("
      - "httpx\\.(post|put)\\b"
      - "urllib\\.request|urlopen\\s*\\("
      - "fetch\\s*\\("
      - "axios(\\.(post|put))?\\s*\\("
      - "\\.post\\s*\\("
      - "\\bcurl\\b"
      - "websocket|socket\\.connect"

  # --- Data leakage: sensitive-data surface (MCP-T13) -----------------------
  DL-001:
    confidence: medium
    category: data_leakage
    severity: medium
    threat: MCP-T13
    source: {ref: mcp-survey, section: "5.3.4"}
    message: "Tool touches sensitive personal or credential data (PII / secrets tables and columns)."
    recommendation: "Confirm the agent genuinely needs this data. Mask or exclude PII/credential columns, avoid SELECT * on sensitive tables, and log access for review."
    patterns:
      - "select\\s+\\*\\s+from\\s+\\w*(user|customer|account|employee|patient|member|client|payment)"
      - "\\bssn\\b|social[ _]security"
      - "credit[ _-]?card|card_number|\\bcvv\\b|\\bcvc\\b|\\biban\\b"
      - "\\bpassport\\b"
      - "password_hash|passwd\\b"
      - "\\bsalar(y|ies)\\b|payroll"
      - "medical[ _]record|health[ _]record|\\bdiagnosis\\b"
      - "api_keys?\\s+(table|from)|from\\s+(api_keys|secrets|credentials|tokens)\\b"

  # --- Meta / unauthorized access (MCP-T13) --------------------------------
  ME-001:
    confidence: high
    category: meta
    severity: info
    threat: MCP-T13
    source: {ref: mcp-survey, section: "5.3.4"}
    message: "Tool definitions found but no authentication signal detected (unauthenticated exposure is a known MCP risk)."
    recommendation: "Add authentication/authorization to the server if it is network-exposed."

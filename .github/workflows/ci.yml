name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Verify PATH-independent CLI
        run: python -m mcp_auditor --help

  package-windows:
    name: Build and install wheel on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in a clean environment
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/mcp_auditor_static-*.whl | Select-Object -First 1
          python -m venv smoke
          ./smoke/Scripts/python.exe -m pip install $wheel.FullName
          ./smoke/Scripts/python.exe -m mcp_auditor --help
          ./smoke/Scripts/mcp-audit.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

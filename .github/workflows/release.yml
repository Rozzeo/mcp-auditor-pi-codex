name: GitHub Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag matches package version
        shell: python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}", (
              f"tag {os.environ['RELEASE_TAG']} does not match package v{version}"
          )
      - name: Test and build distributions
        run: |
          python -m pip install ".[dev]" build
          python -m pytest -q
          python -m build
      - name: Smoke-test the wheel
        run: |
          python -m venv smoke
          smoke/bin/python -m pip install dist/mcp_auditor_static-*.whl
          smoke/bin/python -m mcp_auditor --help
          smoke/bin/mcp-audit --help
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
      # `create` alone fails when the release already exists; `upload` alone
      # fails when it does not. A tag push can arrive either way -- re-running a
      # failed release, or tagging fresh -- so create it only if it is missing.
      - name: Create GitHub Release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" dist/* --clobber
